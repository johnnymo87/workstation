name: Check NixOS channel EOL

on:
  schedule:
    # Weekly on Mondays at 07:15 UTC
    - cron: '15 7 * * 1'
  workflow_dispatch:

concurrency:
  group: check-channel-eol
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check channel freshness and EOL window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check-channel-eol.py
