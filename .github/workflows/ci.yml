name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The single-entry matrix is deliberate and load-bearing: it is what makes
    # this job report as "check (ubuntu-24.04-arm)", which is the exact context
    # branch protection requires. Inlining `runs-on: ubuntu-24.04-arm` and
    # dropping the matrix would rename the job to plain "check", the required
    # context would never report, and every PR would block forever waiting on
    # it. Renaming means updating branch protection in the same breath.
    #
    # There used to be a second `ubuntu-latest` leg. It was a leftover of the
    # Crostini (x86_64-linux) target removed in 4d19e88: the flake exposes no
    # x86_64-linux outputs, so `nix flake check` there built nothing and merely
    # confirmed the flake evaluates, while presenting a green check that
    # implied coverage it did not have. Removed once the matching required
    # context was dropped from branch protection.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The ARM leg builds real closures from a cold store every run, because
    # runners are ephemeral. Kept generous deliberately: the devenv substituter
    # below removes the largest single cost, but this repo's OWN packages (beads,
    # gws, bb, clerk, teamclaude, vercel, ask-question, opencode-frontdoor) are
    # still in no cache and are compiled every run, so this is not a fast job and
    # a tight bound would only produce flaky timeouts.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # devenv is a Rust program built as per-crate derivations, it is pulled into
      # BOTH home configs (flake.nix -> users/dev/home.base.nix), and nothing in
      # cache.nixos.org substitutes it -- so every cold CI run compiled ~579
      # rust_* crates from source. That was the bulk of a ~50 minute check.
      # devenv publishes a PUBLIC cache; adding it as a substituter needs no
      # secret and does not weaken the gate, because trust is still by signing
      # key. Verified before adding: our exact pin
      # (devenv-wrapped-2.1.3, m66qfslh...) returns HTTP 200 from
      # devenv.cachix.org and 404 from cache.nixos.org, and the key below is the
      # one the cachix API reports for the cache AND the one that signed that
      # path's narinfo.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Disk space before
        run: df -h /

      # --print-build-logs is not cosmetic. Without it a failing derivation
      # prints only "For full logs, run: nix log /nix/store/...drv", and that
      # store path dies with the runner -- leaving a red check with no way to
      # see WHY. The failure this gate exists to catch (shellcheck rejecting a
      # writeShellApplication) is legible only in the build log.
      # --keep-going reports every broken configuration in one run instead of
      # stopping at the first.
      - name: Run nix flake check
        run: nix flake check --print-build-logs --keep-going

      - name: Disk space after
        if: always()
        run: df -h /
