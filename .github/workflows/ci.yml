name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The single-entry matrix is deliberate and load-bearing: it is what makes
    # this job report as "check (ubuntu-24.04-arm)", which is the exact context
    # branch protection requires. Inlining `runs-on: ubuntu-24.04-arm` and
    # dropping the matrix would rename the job to plain "check", the required
    # context would never report, and every PR would block forever waiting on
    # it. Renaming means updating branch protection in the same breath.
    #
    # There used to be a second `ubuntu-latest` leg. It was a leftover of the
    # Crostini (x86_64-linux) target removed in 4d19e88: the flake exposes no
    # x86_64-linux outputs, so `nix flake check` there built nothing and merely
    # confirmed the flake evaluates, while presenting a green check that
    # implied coverage it did not have. Removed once the matching required
    # context was dropped from branch protection.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Kept generous deliberately. Two layers now cut the cost -- the devenv
    # substituter and the Nix-store cache below -- but a cache MISS (first run on
    # a new key with no prefix match, or after a purge) still pays the full cold
    # build, so the bound has to cover the uncached case rather than the happy one.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # devenv is a Rust program built as per-crate derivations, it is pulled into
      # BOTH home configs (flake.nix -> users/dev/home.base.nix), and nothing in
      # cache.nixos.org substitutes it -- so every cold CI run compiled ~579
      # rust_* crates from source. That was the bulk of a ~50 minute check.
      # devenv publishes a PUBLIC cache; adding it as a substituter needs no
      # secret and does not weaken the gate, because trust is still by signing
      # key. Verified before adding: our exact pin
      # (devenv-wrapped-2.1.3, m66qfslh...) returns HTTP 200 from
      # devenv.cachix.org and 404 from cache.nixos.org, and the key below is the
      # one the cachix API reports for the cache AND the one that signed that
      # path's narinfo.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The remaining cost after the devenv substituter was this repo's own

      # uncached builds, and wrangler dominated them: measured 5.9 of 12.2 minutes

      # (49%) on run 30566609050, because wrangler-4.62.0 is 404 on cache.nixos.org

      # for aarch64-linux -- Hydra does not build it -- so pnpm-deps, the DTS build,

      # auto-patchelf and fixup all ran from source every time.

      #

      # This uses the GitHub Actions cache as a Nix store cache, which needs NO

      # external account and NO secret, unlike Cachix. A self-hosted runner would be

      # faster still but GitHub advises against them on PUBLIC repositories, since a

      # fork PR can execute arbitrary code on the runner.

      #

      # The store is GC'd to ~7GB before saving because the Actions cache quota is

      # 10GB per repo and an ungarbage-collected store exceeds it. Old entries are

      # purged so a stale cache cannot silently squat the quota and starve new saves.

      - name: Restore and save the Nix store

        uses: nix-community/cache-nix-action@v7.0.2

        with:

          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}

          restore-prefixes-first-match: nix-${{ runner.os }}-

          gc-max-store-size-linux: 7000000000

          purge: true

          purge-prefixes: nix-${{ runner.os }}-

          purge-created: 604800

          purge-primary-key: never

          # Restore everywhere, save only on main.
          #
          # A .nix-touching PR rotates the primary key, so its run misses and would
          # save a multi-GB entry scoped to refs/pull/N/merge. The daily bot PRs
          # (update-bb, update-gws, update-opencode-patched, update-packages) all
          # touch .nix files, so several such entries can be in flight at once.
          # Against a 10GB repo limit that means GitHub silently LRU-evicts entries
          # we still want, and a main run cannot clean them up because purge is
          # scoped to the current ref. Saving only from main keeps one lineage.
          save: ${{ github.ref == 'refs/heads/main' }}


      - name: Disk space before
        run: df -h /

      # --print-build-logs is not cosmetic. Without it a failing derivation
      # prints only "For full logs, run: nix log /nix/store/...drv", and that
      # store path dies with the runner -- leaving a red check with no way to
      # see WHY. The failure this gate exists to catch (shellcheck rejecting a
      # writeShellApplication) is legible only in the build log.
      # --keep-going reports every broken configuration in one run instead of
      # stopping at the first.
      - name: Run nix flake check
        run: nix flake check --print-build-logs --keep-going

      # The ONE suite in this repo that cannot be a nix check, and the reason
      # channel (b) exists in users/dev/test-unwired-tests.sh.
      #
      # pkgs/ask-question/test.sh asserts properties OF A DERIVATION: that the
      # deps stage has no bun in its inputDrvs, that it is not a fixed-output
      # derivation, that drvPath is stable across two SEPARATE evaluations, and
      # that the built CLI vendors undici. It therefore runs `nix eval`, `nix
      # derivation show` and `nix build` itself, none of which work inside a
      # build sandbox -- so it is wired here instead, which the guard blesses.
      #
      # Rewriting it into eval-time assertions inside flake.nix was considered
      # and rejected: an assert on `nativeBuildInputs` is strictly WEAKER than
      # jq over the real drv's inputDrvs (bun can re-enter through any attr or
      # wrapper and the drv-level check still sees it), and the two-process
      # drvPath comparison cannot be expressed inside a single evaluation at
      # all. That trade would have deleted one invariant and quietly weakened
      # another while claiming the same coverage.
      #
      # `if: always()` mirrors --keep-going above: when both this and the flake
      # check are broken, one run should report both rather than hiding this
      # behind the first failure.
      - name: Run the ask-question derivation-invariant suite (cannot be hermetic)
        if: always()
        run: bash pkgs/ask-question/test.sh

      # Root the checked configurations before the cache step runs.
      #
      # Without this the cache is real but useless, which is worse than no cache
      # because it looks healthy. Measured on run 30600536667: "Cache hit ...
      # Cache restored successfully", 1474 MB -- and wrangler-4.62.0.drv plus
      # wrangler-pnpm-deps.drv built anyway, so the job stayed at ~12 min.
      #
      # Cause: `nix flake check` realises its checks but leaves no gcroot behind, so
      # the garbage collection that cache-nix-action runs to fit gc-max-store-size
      # is free to delete every one of them before the save. What got cached was the
      # cheap residue, not the expensive closures.
      #
      # `nix build -o` creates an indirect gcroot, which the GC cannot remove. These
      # are already built by the check above, so this costs seconds and only pins
      # them. gc-max-store-size stays as a best-effort ceiling: GC will now simply
      # fail to reach it rather than evict what we are trying to keep.
      - name: Pin the checked configurations so the pre-save GC cannot drop them
        run: |
          mkdir -p /tmp/ci-gcroots
          nix build --print-build-logs -o /tmp/ci-gcroots/home-dev '.#checks.aarch64-linux.home-dev'
          nix build -o /tmp/ci-gcroots/home-cloudbox '.#checks.aarch64-linux.home-cloudbox'
          nix build -o /tmp/ci-gcroots/nixos-devbox   '.#checks.aarch64-linux.nixos-devbox'
          ls -l /tmp/ci-gcroots/

      - name: Disk space after
        if: always()
        run: df -h /
