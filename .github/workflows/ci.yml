name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The single-entry matrix is deliberate and load-bearing: it is what makes
    # this job report as "check (ubuntu-24.04-arm)", which is the exact context
    # branch protection requires. Inlining `runs-on: ubuntu-24.04-arm` and
    # dropping the matrix would rename the job to plain "check", the required
    # context would never report, and every PR would block forever waiting on
    # it. Renaming means updating branch protection in the same breath.
    #
    # There used to be a second `ubuntu-latest` leg. It was a leftover of the
    # Crostini (x86_64-linux) target removed in 4d19e88: the flake exposes no
    # x86_64-linux outputs, so `nix flake check` there built nothing and merely
    # confirmed the flake evaluates, while presenting a green check that
    # implied coverage it did not have. Removed once the matching required
    # context was dropped from branch protection.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Kept generous deliberately. Two layers now cut the cost -- the devenv
    # substituter and the Nix-store cache below -- but a cache MISS (first run on
    # a new key with no prefix match, or after a purge) still pays the full cold
    # build, so the bound has to cover the uncached case rather than the happy one.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # devenv is a Rust program built as per-crate derivations, it is pulled into
      # BOTH home configs (flake.nix -> users/dev/home.base.nix), and nothing in
      # cache.nixos.org substitutes it -- so every cold CI run compiled ~579
      # rust_* crates from source. That was the bulk of a ~50 minute check.
      # devenv publishes a PUBLIC cache; adding it as a substituter needs no
      # secret and does not weaken the gate, because trust is still by signing
      # key. Verified before adding: our exact pin
      # (devenv-wrapped-2.1.3, m66qfslh...) returns HTTP 200 from
      # devenv.cachix.org and 404 from cache.nixos.org, and the key below is the
      # one the cachix API reports for the cache AND the one that signed that
      # path's narinfo.
      #
      # gamebox's devenvPkg (x86_64) is import-from-derivation of an x86_64-only
      # drv (cabal2nix-cachix, preferLocalBuild, allowSubstitutes=false) that
      # the aarch64 runner cannot build; it is on devenv.cachix.org but nix only
      # substitutes preferLocalBuild/allowSubstitutes=false drvs when
      # always-allow-substitutes = true.
      # Local equivalent: nix flake check --keep-going --option always-allow-substitutes true (on devbox/cloudbox).
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            always-allow-substitutes = true

      # The remaining cost after the devenv substituter was this repo's own

      # uncached builds, and wrangler dominated them: measured 5.9 of 12.2 minutes

      # (49%) on run 30566609050, because wrangler-4.62.0 is 404 on cache.nixos.org

      # for aarch64-linux -- Hydra does not build it -- so pnpm-deps, the DTS build,

      # auto-patchelf and fixup all ran from source every time.

      #

      # This uses the GitHub Actions cache as a Nix store cache, which needs NO

      # external account and NO secret, unlike Cachix. A self-hosted runner would be

      # faster still but GitHub advises against them on PUBLIC repositories, since a

      # fork PR can execute arbitrary code on the runner.

      #

      # The store is GC'd to ~7GB before saving because the Actions cache quota is

      # 10GB per repo and an ungarbage-collected store exceeds it. Old entries are

      # purged so a stale cache cannot silently squat the quota and starve new saves.

      - name: Restore and save the Nix store

        uses: nix-community/cache-nix-action@v7.0.2

        with:

          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}

          restore-prefixes-first-match: nix-${{ runner.os }}-

          gc-max-store-size-linux: 7000000000

          purge: true

          purge-prefixes: nix-${{ runner.os }}-

          purge-created: 604800

          purge-primary-key: never

          # Restore everywhere, save only on main.
          #
          # A .nix-touching PR rotates the primary key, so its run misses and would
          # save a multi-GB entry scoped to refs/pull/N/merge. The daily bot PRs
          # (update-bb, update-gws, update-opencode-patched, update-packages) all
          # touch .nix files, so several such entries can be in flight at once.
          # Against a 10GB repo limit that means GitHub silently LRU-evicts entries
          # we still want, and a main run cannot clean them up because purge is
          # scoped to the current ref. Saving only from main keeps one lineage.
          save: ${{ github.ref == 'refs/heads/main' }}


      - name: Disk space before
        run: df -h /

      # Pre-seed private FOD sources for nixos-cloudbox.
      #
      # nixosConfigurations.cloudbox includes claude-failover-proxy (and in the
      # future devbox may include cfp-shaper), which fetches release assets
      # from the private repo johnnymo87/claude-failover-proxy. In CI, we use the
      # CFP_READ_TOKEN secret to download the assets via the GitHub API and add
      # them to the Nix store as fixed-output derivations. Once added, Nix sees
      # the FODs as already realised and does not attempt an unauthenticated fetch.
      #
      # Fork PRs do not have access to repository secrets; fail loudly with a
      # clear message rather than a confusing 404.
      - name: Pre-seed private release assets
        env:
          GH_TOKEN: ${{ secrets.CFP_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CFP_READ_TOKEN secret is empty or unset."
            echo "Fork PRs do not receive repository secrets and cannot pre-seed private assets for nixos-cloudbox."
            exit 1
          fi

          sources=$(nix eval --json '.#claude-failover-proxy.passthru.privateSources')
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          while IFS= read -r src; do
            [ -z "$src" ] && continue
            name=$(echo "$src" | jq -r '.name')
            url=$(echo "$src" | jq -r '.url')
            expected_path=$(echo "$src" | jq -r '.storePath')

            echo "Fetching private FOD source $name from $url..."
            gh api -H 'Accept: application/octet-stream' "$url" > "$tmpdir/$name"

            actual_path=$(nix-store --add-fixed sha256 "$tmpdir/$name")
            rm -f "$tmpdir/$name"

            echo "  Expected: $expected_path"
            echo "  Actual:   $actual_path"

            if [ "$actual_path" != "$expected_path" ]; then
              echo "::error::Pre-seeded store path mismatch for $name: expected $expected_path, got $actual_path"
              exit 1
            fi
            echo "Successfully pre-seeded $name -> $actual_path"
          done < <(echo "$sources" | jq -c '.[]')

      # --print-build-logs is not cosmetic. Without it a failing derivation
      # prints only "For full logs, run: nix log /nix/store/...drv", and that
      # store path dies with the runner -- leaving a red check with no way to
      # see WHY. The failure this gate exists to catch (shellcheck rejecting a
      # writeShellApplication) is legible only in the build log.
      # --keep-going reports every broken configuration in one run instead of
      # stopping at the first.
      #
      # Do NOT add --no-build here, and do not reach for it locally either.
      # nixpkgs' nixos/modules/virtualisation/google-compute-config.nix does
      #   boot.extraModprobeConfig =
      #     readFile "${pkgs.google-guest-configs}/etc/modprobe.d/gce-blacklist.conf";
      # which is import-from-derivation: cloudbox cannot finish EVALUATING
      # until google-guest-configs has actually been BUILT, because readFile
      # has to read a file out of its output. --no-build forbids exactly that
      # build, so nix cannot realise the path's context and aborts with
      #   error: path '/nix/store/...-google-guest-configs-<ver>.drv' is not valid
      # That message names a store path, so it reads like GC damage or a
      # corrupt store. It is not. It means "you told me not to build, and I
      # needed to build."
      #
      # The tell, if you ever see it: run the check again WITHOUT --no-build
      # once. After that the IFD dependency is realised, and --no-build starts
      # passing on the very same tree with no source change.
      - name: Run nix flake check
        run: nix flake check --print-build-logs --keep-going

      # The ONE suite in this repo that cannot be a nix check, and the reason
      # channel (b) exists in users/dev/test-unwired-tests.sh.
      #
      # pkgs/ask-question/test.sh asserts properties OF A DERIVATION: that the
      # deps stage has no bun in its inputDrvs, that it is not a fixed-output
      # derivation, that drvPath is stable across two SEPARATE evaluations, and
      # that the built CLI vendors undici. It therefore runs `nix eval`, `nix
      # derivation show` and `nix build` itself, none of which work inside a
      # build sandbox -- so it is wired here instead, which the guard blesses.
      #
      # Rewriting it into eval-time assertions inside flake.nix was considered
      # and rejected: an assert on `nativeBuildInputs` is strictly WEAKER than
      # jq over the real drv's inputDrvs (bun can re-enter through any attr or
      # wrapper and the drv-level check still sees it), and the two-process
      # drvPath comparison cannot be expressed inside a single evaluation at
      # all. That trade would have deleted one invariant and quietly weakened
      # another while claiming the same coverage.
      #
      # `if: always()` mirrors --keep-going above: when both this and the flake
      # check are broken, one run should report both rather than hiding this
      # behind the first failure.
      - name: Run the ask-question derivation-invariant suite (cannot be hermetic)
        if: always()
        run: bash pkgs/ask-question/test.sh

      # The plugin-bundle family, for the same reason as ask-question above:
      # these assert properties OF A DERIVATION -- no bun in the deps stage's
      # inputDrvs, deps stage is not a fixed-output derivation, drvPath stable
      # across two SEPARATE evaluations -- so they run `nix eval`, `nix
      # derivation show` and `nix build` themselves and cannot nest in a build
      # sandbox. workstation-m98t's own description prescribed injecting the
      # built artifact via an env var, the seam used for the oo4q suites; that
      # was wrong here, because it covers only the three artifact-level
      # invariants and deletes the three derivation-level ones the bead exists
      # for. Note the package DOES have doCheck=true and a real checkPhase that
      # runs in CI inside the home closures, but that checkPhase is a bun-load
      # smoke test and does not run test.sh -- the oc-session-list trap, and why
      # the reachability guard refuses checkPhase as evidence.
      #
      # Only the two shims are named. The shared runner they exec is credited by
      # the guard's transitive closure, which as of this commit can finally parse
      # their `$(dirname "${BASH_SOURCE[0]}")` delegation (meta-test case 7b).
      - name: Run the plugin-bundle derivation-invariant suites (cannot be hermetic)
        if: always()
        run: |
          bash pkgs/session-state-plugin/test.sh
          bash pkgs/self-compact-plugin/test.sh

      # Root the checked configurations before the cache step runs.
      #
      # Without this the cache is real but useless, which is worse than no cache
      # because it looks healthy. Measured on run 30600536667: "Cache hit ...
      # Cache restored successfully", 1474 MB -- and wrangler-4.62.0.drv plus
      # wrangler-pnpm-deps.drv built anyway, so the job stayed at ~12 min.
      #
      # Cause: `nix flake check` realises its checks but leaves no gcroot behind, so
      # the garbage collection that cache-nix-action runs to fit gc-max-store-size
      # is free to delete every one of them before the save. What got cached was the
      # cheap residue, not the expensive closures.
      #
      # `nix build -o` creates an indirect gcroot, which the GC cannot remove. These
      # are already built by the check above, so this costs seconds and only pins
      # them. gc-max-store-size stays as a best-effort ceiling: GC will now simply
      # fail to reach it rather than evict what we are trying to keep.
      #
      # NOTE ON nixos-cloudbox: nixos-cloudbox is DELIBERATELY NOT pinned here.
      # nixos-cloudbox depends on claude-failover-proxy, whose binary comes from
      # a private repository. Pinning nixos-cloudbox would prevent the scrub
      # step below from deleting the private binary and its referrers closure,
      # which would cause the private binary to leak into the saved Nix store cache.
      - name: Pin the checked configurations so the pre-save GC cannot drop them
        run: |
          mkdir -p /tmp/ci-gcroots
          nix build --print-build-logs -o /tmp/ci-gcroots/home-dev '.#checks.aarch64-linux.home-dev'
          nix build -o /tmp/ci-gcroots/home-cloudbox '.#checks.aarch64-linux.home-cloudbox'
          nix build -o /tmp/ci-gcroots/nixos-devbox   '.#checks.aarch64-linux.nixos-devbox'
          ls -l /tmp/ci-gcroots/

      # CRITICAL LEAK VECTOR:
      # This repository is public and cache-nix-action saves the Nix store on
      # main. Fork PRs can restore main's Actions caches. Private binaries (and
      # anything referencing them, such as the nixos-cloudbox system closure) must
      # NOT be present in the saved cache.
      #
      # This step runs with `if: always()` after everything that uses the store
      # and before cache-nix-action's post-save action (post-steps execute after
      # all main job steps). It removes any GC root that might pin the private
      # assets, queries the full referrers closure of the private FOD paths,
      # deletes them with --ignore-liveness, and asserts none remain.
      - name: Scrub private binaries from Nix store before cache save
        if: always()
        run: |
          set -euo pipefail

          # Get expected private FOD paths from the package definition
          sources=$(nix eval --json '.#claude-failover-proxy.passthru.privateSources' 2>/dev/null || echo "[]")
          fod_paths=$(echo "$sources" | jq -r '.[].storePath // empty')

          if [ -z "$fod_paths" ]; then
            echo "No private FOD paths found to scrub."
            exit 0
          fi

          echo "Private FOD paths to scrub:"
          echo "$fod_paths"

          # Remove any gcroot in /tmp/ci-gcroots just in case
          rm -f /tmp/ci-gcroots/nixos-cloudbox

          # Query all existing FOD paths in the store
          existing_fods=()
          for p in $fod_paths; do
            if [ -e "$p" ]; then
              existing_fods+=("$p")
            fi
          done

          if [ ${#existing_fods[@]} -eq 0 ]; then
            echo "None of the private FOD paths are present in the store."
            exit 0
          fi

          # Find full referrers closure of all existing private FOD paths
          mapfile -t to_delete < <(nix-store --query --referrers-closure "${existing_fods[@]}")

          if [ ${#to_delete[@]} -gt 0 ]; then
            echo "Deleting private FODs and referrers closure:"
            printf '%s\n' "${to_delete[@]}"

            # Pass all paths to delete. Multiple passes handle any dependency ordering.
            for _ in 1 2 3 4 5; do
              nix-store --delete --ignore-liveness "${to_delete[@]}" >/dev/null 2>&1 || true
            done

            # Assert that NONE remain
            leaked=0
            for p in "${to_delete[@]}"; do
              if [ -e "$p" ]; then
                echo "::error::Failed to scrub private path from store: $p still exists!"
                leaked=1
              fi
            done

            if [ "$leaked" -ne 0 ]; then
              echo "::error::Private paths leaked into the Nix store closure!"
              exit 1
            fi
            echo "Successfully scrubbed all private FODs and referrers from the store."
          fi

      - name: Disk space after
        if: always()
        run: df -h /
