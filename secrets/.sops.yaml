# Recipients and creation rules for sops-encrypted secrets.
#
# creation_rules apply when a file is CREATED. Editing this file does not
# re-encrypt anything that already exists -- an existing file's recipients live
# in its own sops metadata. Changing them takes a separate command, either
# `sops updatekeys <file>` (applies these rules) or `sops rotate --add-age /
# --rm-age`. So adding a host here does not grant it access to secrets that are
# already committed.
#
# NOTE the path_regex is matched against the path with THIS CONFIG FILE'S
# DIRECTORY STRIPPED. Since this file lives in secrets/, the string matched for
# secrets/devbox.yaml is `devbox.yaml` -- so the regex must NOT be anchored with
# a `secrets/` prefix. It was, from the beginning, which meant every rule here
# silently matched nothing and sops answered `no matching creation rules found`
# for any updatekeys/-e invocation. Fixed 2026-09; verify with:
#   sops --config secrets/.sops.yaml updatekeys -y secrets/devbox.yaml
# which must print "already up to date", NOT an error.
#
# (The chromebook key and its rule were removed in 2026-09; that host is
# decommissioned and secrets/chromebook.yaml is gone. It was not a recipient of
# any surviving file -- checked before removal.)
keys:
  - &devbox age1kyd7dzxtgte0rcd0nj3chfvcfvammhywe63f25tlsrf8knhf3u8sxp8z9n
  - &cloudbox age174vpw7fkhxae05xd0wtl3ytg6778w2cztxgp8wupu32h7yly396quj6k55

creation_rules:
  - path_regex: devbox\.yaml$
    key_groups:
      - age:
          - *devbox

  - path_regex: cloudbox\.yaml$
    key_groups:
      - age:
          - *cloudbox
